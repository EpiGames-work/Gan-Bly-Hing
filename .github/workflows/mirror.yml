name: Mirror to Epitech

on:
    push:
        branches: [main, dev]
        tags: ['*']
    workflow_dispatch:

concurrency:
    group: mirror
    cancel-in-progress: false

jobs:
    mirror:
        if: github.repository == vars.SRC_REPOSITORY_REF
        runs-on: ubuntu-latest
        environment: mirror
        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Push to mirror
                uses: pixta-dev/repository-mirroring-action@v1
                with:
                    target_repo_url: ${{ vars.DST_SSH_URL }}
                    ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
