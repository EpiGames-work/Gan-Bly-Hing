services:
    db:
        image: postgres:17
        container_name: ganblyhing
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-ganblyhing}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ganblyhing}
            POSTGRES_DB: ${POSTGRES_DB:-ganblyhing}
        ports:
            -   5432:5432
        volumes:
            -   pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata: